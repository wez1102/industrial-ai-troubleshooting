[project]
name = "plantassist"
version = "0.1.0"
description = "Local-LLM RAG troubleshooting assistant for industrial equipment"
readme = "README.md"
authors = [
    { name = "Wasay Aamer", email = "165823451+wez1102@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
plantassist = "plantassist:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "unit: fast tests with no external services",
    "integration: tests that need Docker (PostgreSQL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["plantassist"]
branch = true

[tool.coverage.report]
show_missing = true
