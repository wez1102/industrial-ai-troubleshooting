version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      python-runtime:
        dependency-type: production
      python-dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-python-env
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
