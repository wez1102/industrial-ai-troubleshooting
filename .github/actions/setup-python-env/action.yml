name: Set up Python environment
description: Install uv, the right Python and the locked project dependencies.

inputs:
  python-version:
    description: Python version to use. Empty means the one in .python-version.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "latest-known"
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync --locked
