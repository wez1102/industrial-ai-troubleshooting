name: Set up Python environment
description: Install uv, the right Python and the locked project dependencies.

inputs:
  python-version:
    description: Python version to use. Empty means the one in .python-version.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "latest-known"
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync --locked
